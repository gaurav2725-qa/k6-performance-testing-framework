name: Performance Testing

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    name: k6 Smoke Test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Smoke Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: scripts/smoke-test.js

      - name: Run Load Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: scripts/load-test.js